<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat em Tempo Real</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="chat-container">
    <div id="header">Chat em Tempo Real</div>
    <div id="messages"></div>
    <form id="form">
      <input type="text" id="user-input" placeholder="Seu nome" required />
      <input type="text" id="message-input" placeholder="Mensagem..." required autocomplete="off" />
      <button type="submit">Enviar</button>
    </form>
  </div>

  <!-- Importando o arquivo renomeado -->
  <script type="module" src="javascript.js"></script>
</body>
</html>
